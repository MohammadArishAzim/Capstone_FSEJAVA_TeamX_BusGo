<nav class="navbar">
  <a class="brand" routerLink="/">BusGo</a>

  <div class="links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Search</a>

    @if (auth.isLoggedIn()) {
      <a routerLink="/my-trips" routerLinkActive="active">My Trips</a>
    }

    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
    }

    @if (auth.isLoggedIn()) {
      <span class="user-name">{{ auth.currentUser()?.name }}</span>
      <button class="link-button" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </div>
</nav>
