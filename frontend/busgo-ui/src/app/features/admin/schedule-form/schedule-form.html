<form class="card admin-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3>{{ editingSchedule ? 'Edit Schedule' : 'Add Schedule' }}</h3>

  <div class="form-grid">
    <div class="form-field">
      <label for="busId">Bus</label>
      <select id="busId" formControlName="busId">
        <option [value]="0" disabled>Select a bus</option>
        @for (bus of buses(); track bus.id) {
          <option [value]="bus.id">{{ bus.operatorName }} ({{ bus.busNumber }})</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="fromCity">From City</label>
      <input id="fromCity" type="text" formControlName="fromCity" placeholder="Hyderabad" />
    </div>

    <div class="form-field">
      <label for="toCity">To City</label>
      <input id="toCity" type="text" formControlName="toCity" placeholder="Bangalore" />
    </div>

    <div class="form-field">
      <label for="journeyDate">Journey Date</label>
      <input id="journeyDate" type="date" formControlName="journeyDate" />
    </div>

    <div class="form-field">
      <label for="departureTime">Departure Time</label>
      <input id="departureTime" type="time" formControlName="departureTime" />
    </div>

    <div class="form-field">
      <label for="arrivalTime">Arrival Time</label>
      <input id="arrivalTime" type="time" formControlName="arrivalTime" />
    </div>

    <div class="form-field">
      <label for="fare">Fare (&#8377;)</label>
      <input id="fare" type="number" formControlName="fare" min="1" />
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Saving...' : 'Save' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </div>
</form>
