<form class="card admin-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3>{{ editingBus ? 'Edit Bus' : 'Add Bus' }}</h3>

  <div class="form-grid">
    <div class="form-field">
      <label for="busNumber">Bus Number</label>
      <input id="busNumber" type="text" formControlName="busNumber" placeholder="KA-01-AB-1234" />
    </div>

    <div class="form-field">
      <label for="operatorName">Operator Name</label>
      <input id="operatorName" type="text" formControlName="operatorName" placeholder="VRL Travels" />
    </div>

    <div class="form-field">
      <label for="totalSeats">Total Seats</label>
      <input id="totalSeats" type="number" formControlName="totalSeats" min="1" />
    </div>

    <div class="form-field">
      <label for="busType">Bus Type</label>
      <select id="busType" formControlName="busType">
        <option value="SEATER">SEATER</option>
        <option value="SLEEPER">SLEEPER</option>
      </select>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Saving...' : 'Save' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </div>
</form>
